name: Check and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate questions and learning logic
        run: |
          node --check teo-core.js
          node --check teo-ui.js
          node --check service-core.js
          node --check service-data.js
          node --check industry-data.js
          node --check industry-core.js
          node --check service-ui.js
          node --check reasoning-core.js
          node --check reasoning-data.js
          node --check reasoning-scene.js
          node --check reasoning-ui.js
          node --check workshop-core.js
          node --check workshop-ui.js
          node --check workshop-scene.js
          node --check app.js
          node --check core.js
          node --check practice-ui.js
          node --check practice-core.js
          node --check circuits-ui.js
          node scripts/check-bank.mjs
          node --test tests/*.test.mjs
          python3 scripts/check-teo-numerics.py
          python3 docs/research/reference_solutions.py
      - name: Build static files
        run: node scripts/build.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check electrical theory learning flow
        run: node scripts/check-teo-ui.cjs
      - name: Check mobile practice flow
        run: node scripts/check-practice-ui.cjs
      - name: Check industrial workshop
        run: node scripts/check-workshop-ui.cjs
      - name: Check reasoning labs and experiments
        run: node scripts/check-reasoning-ui.cjs
      - name: Check service diagnostic scenarios
        run: node scripts/check-service-ui.cjs
      - name: Check full release flows and recovery
        run: node scripts/check-release-ui.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-ui-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
